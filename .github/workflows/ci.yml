name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Static Analysis (Detekt & Ktlint)
        run: |
          ./gradlew spotlessCheck
          ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Code Coverage (Kover)
        run: ./gradlew koverHtmlReportDebug
