name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build with Gradle (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Static Analysis (Detekt & Spotless)
        run: |
          gradle spotlessCheck --stacktrace
          gradle detekt --stacktrace

      - name: Android Lint
        run: gradle lintDebug --stacktrace

      - name: Code Coverage (Kover)
        run: gradle koverHtmlReportDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
